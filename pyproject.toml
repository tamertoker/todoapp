[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leveltodo"
version = "0.1.0"
description = "Seviye Sistemli Görev Takip Sistemi — pixel-RPG estetikli masaüstü yaşam yönetimi"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.6",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "blinker>=1.7",
    "python-dateutil>=2.9",
    "platformdirs>=4.2",
    "python-ulid>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[project.scripts]
leveltodo = "leveltodo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leveltodo = ["**/*.mako", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
