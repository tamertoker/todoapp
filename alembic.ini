# Alembic — geliştirme sırasında elle komut çalıştırmak için (örn. yeni
# migration üretmek: `alembic revision --autogenerate -m "..."`).
# Uygulama açılışta migration'ları programatik çalıştırır (migrations.py);
# o yüzden sqlalchemy.url burada boş bırakılır ve çalışma anında doldurulur.

[alembic]
script_location = src/leveltodo/infrastructure/persistence/sqlite/migrations
prepend_sys_path = src
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
